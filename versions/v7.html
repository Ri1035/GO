<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaldea Security — 徽章动画</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpath%20d='M21%204a13%2013%200%201%200%200%2024%2012%2012%200%200%201%200-24z'%20fill='%232ee6ff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #04070d;
    --panel: #060b14;
    --cyan: #2ee6ff;
    --cyan-soft: #7fdbee;
    --grid: rgba(46, 230, 255, 0.05);
    --grid-bright: rgba(46, 230, 255, 0.16);
    --text: #cdeef6;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(90% 60% at 50% -12%, #0b1726 0%, transparent 62%),
      var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    height: 100dvh;
    display: grid;
    place-items: center;
  }
  /* ---- 海报卡片 ---- */
  .poster {
    position: relative;
    height: 86vh;
    aspect-ratio: 1512 / 2700;
    max-width: 92vw;
    border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(46, 230, 255, 0.18), 0 0 44px rgba(46, 230, 255, 0.10), 0 30px 80px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    background: var(--panel);
    z-index: 2;
  }
  /* 网格底纹 */
  .poster::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 36px 36px;
    pointer-events: none;
    z-index: 0;
  }
  /* 扫描线 */
  .scanline {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(46, 230, 255, 0.35), transparent);
    pointer-events: none;
    z-index: 0;
    animation: scan 9s ease-in-out infinite alternate;
  }
  @keyframes scan {
    from { transform: translateY(12vh); }
    to   { transform: translateY(72vh); }
  }
  /* 四角 HUD 刻度 */
  .corner {
    position: absolute;
    width: 18px;
    height: 18px;
    pointer-events: none;
    z-index: 3;
  }
  .corner.tl { top: 10px; left: 10px; border-top: 2px solid var(--grid-bright); border-left: 2px solid var(--grid-bright); }
  .corner.tr { top: 10px; right: 10px; border-top: 2px solid var(--grid-bright); border-right: 2px solid var(--grid-bright); }
  .corner.bl { bottom: 10px; left: 10px; border-bottom: 2px solid var(--grid-bright); border-left: 2px solid var(--grid-bright); }
  .corner.br { bottom: 10px; right: 10px; border-bottom: 2px solid var(--grid-bright); border-right: 2px solid var(--grid-bright); }
  .poster svg {
    display: block;
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 1;
  }
  /* 原 SVG 全部 12 个路径：青色主题 */
  #bg-sheet path {
    fill: var(--cyan);
    fill-opacity: 0.15;
  }
  #olive, #crescent, #letter-0, #letter-1, #letter-2, #letter-3, #letter-4,
  #letter-5, #letter-6, #letter-7, #letter-8, #letter-9 {
    fill: var(--cyan);
    transform-box: fill-box;
    transform-origin: center;
  }
  #letter-0, #letter-1, #letter-2, #letter-3, #letter-4,
  #letter-5, #letter-6, #letter-7, #letter-8, #letter-9 {
    opacity: 0;
  }
  /* ---- 光晕（徽章背后） ---- */
  .halo {
    position: absolute;
    left: 50%;
    top: 48%;
    width: 72%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(46, 230, 255, 0.20) 0%, rgba(46, 230, 255, 0.07) 42%, transparent 68%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  /* ---- 星环 ---- */
  .stars { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute;
    border-radius: 50%;
    background: var(--cyan-soft);
    opacity: 0;
    box-shadow: 0 0 6px rgba(46, 230, 255, 0.8);
  }
  /* ---- 控制条 ---- */
  .controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 5;
  }
  .controls button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 4px;
    border: 1px solid rgba(46, 230, 255, 0.4);
    background: rgba(6, 11, 20, 0.85);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    font-size: 14px;
    line-height: 1;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, box-shadow 0.18s, transform 0.18s;
  }
  .controls button:hover {
    background: rgba(46, 230, 255, 0.12);
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(46, 230, 255, 0.25);
  }
  .controls button:active { transform: translateY(1px); }
  .controls button:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
  .controls button svg { width: 13px; height: 13px; fill: var(--cyan); }
  .reduced .controls { display: none; }
  .reduced .scanline { animation: none; }
</style>
</head>

  <div class="controls" role="group" aria-label="动画控制">
    <button id="btnPlay" type="button" aria-label="播放动画">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span id="playLabel">播放</span>
    </button>
    <button id="btnReplay" type="button" aria-label="重播动画">
      <svg viewBox="0 0 24 24"><path d="M12 5V2L6 7l6 5V9a4 4 0 1 1-4 4H6a6 6 0 1 0 6-8z"/></svg>
      <span>重播</span>
    </button>
  </div>
</div>
<script>
(function () {
  "use strict";
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  var running = [];
  var playing = true;

  function spawnStars() {
    var wrap = document.getElementById("stars");
    var N = 26;
    for (var i = 0; i < N; i++) {
      var s = document.createElement("span");
      s.className = "star";
      var ang = (i / N) * Math.PI * 2;
      var r = 0.30 + ((i * 37) % 4) * 0.012;
      s.style.left = (50 + Math.cos(ang) * r * 100).toFixed(2) + "%";
      s.style.top = (48 + Math.sin(ang) * r * 100).toFixed(2) + "%";
      var sz = 1 + ((i * 7) % 3);
      s.style.width = sz + "px";
      s.style.height = sz + "px";
      s.dataset.d = ((i * 0.53) % 3.2).toFixed(2);
      s.dataset.dur = (2.4 + ((i * 13) % 26) / 10).toFixed(2);
      wrap.appendChild(s);
    }
  }

  function build(loop) {
    running.forEach(function (a) { try { a.cancel(); } catch (e) {} });
    running = [];
    var ease = "cubic-bezier(0.22, 1, 0.36, 1)";
    var expo = "cubic-bezier(0.16, 1, 0.3, 1)";
    var halo = document.getElementById("halo");
    var olive = document.getElementById("olive");
    var crescent = document.getElementById("crescent");
    var bgSheet = document.getElementById("bg-sheet");
    var letters = [];
    for (var i = 0; i < 10; i++) letters.push(document.getElementById("letter-" + i));

    if (!loop) {
      // 入场序列（自然显现，不卡顿）
      running.push(bgSheet.animate(
        [{ opacity: 0 }, { opacity: 1 }],
        { duration: 700, easing: ease, fill: "both" }));
      running.push(halo.animate(
        [{ opacity: 0, transform: "translate(-50%, -50%) scale(0.72)" },
         { opacity: 1, transform: "translate(-50%, -50%) scale(1)" }],
        { duration: 560, easing: ease, fill: "both" }));
      // 橄榄枝环：以中心点为锚向外延展
      running.push(olive.animate(
        [{ opacity: 0, transform: "scale(0.02) rotate(-16deg)" },
         { opacity: 1, transform: "scale(1) rotate(0deg)" }],
        { duration: 680, easing: expo, fill: "both" }));
      // 月牙：随后从中心由小变大
      running.push(crescent.animate(
        [{ opacity: 0, transform: "scale(0.25)" },
         { opacity: 1, transform: "scale(1)" }],
        { duration: 560, delay: 220, easing: expo, fill: "both" }));
      // 标题点阵：自左往右依次显现
      letters.forEach(function (l, idx) {
        running.push(l.animate(
          [{ opacity: 0, transform: "translateX(-9px)" },
           { opacity: 1, transform: "translateX(0)" }],
          { duration: 380, delay: 540 + idx * 85, easing: ease, fill: "both" }));
      });
    }

    // 循环氛围（轻量，保持自然）
    running.push(halo.animate(
      [{ opacity: 0.85, transform: "translate(-50%, -50%) scale(0.98)" },
       { opacity: 1, transform: "translate(-50%, -50%) scale(1.02)" },
       { opacity: 0.85, transform: "translate(-50%, -50%) scale(0.98)" }],
      { duration: 6000, iterations: Infinity, easing: "ease-in-out" }));
    var stars = document.querySelectorAll(".star");
    Array.prototype.forEach.call(stars, function (s) {
      running.push(s.animate(
        [{ opacity: 0.15 }, { opacity: 0.7 }, { opacity: 0.15 }],
        { duration: parseFloat(s.dataset.dur) * 1000, delay: parseFloat(s.dataset.d) * 1000,
          iterations: Infinity, easing: "ease-in-out" }));
    });
  }

  function setPlaying(on) {
    playing = on;
    running.forEach(function (a) {
      try { if (on) a.play(); else a.pause(); } catch (e) {}
    });
    document.body.classList.toggle("paused", !on);
    document.getElementById("playLabel").textContent = on ? "暂停" : "播放";
    document.getElementById("btnPlay").setAttribute("aria-label", on ? "暂停动画" : "播放动画");
  }

  function init() {
    spawnStars();
    var btnPlay = document.getElementById("btnPlay");
    var btnReplay = document.getElementById("btnReplay");
    var isStatic = /[?&]static=1/.test(window.location.search);
    if (reduced.matches || isStatic) {
      document.body.classList.add("reduced");
      // 静态呈现：全部元素直接可见
      var letters = document.querySelectorAll("[id^='letter-']");
      Array.prototype.forEach.call(letters, function (l) { l.style.opacity = 1; });
      document.getElementById("halo").style.opacity = 1;
      var stars = document.querySelectorAll(".star");
      Array.prototype.forEach.call(stars, function (s) { s.style.opacity = 0.55; });
      return;
    }
    build(false);
    setPlaying(true);
    btnPlay.addEventListener("click", function () { setPlaying(!playing); });
    btnReplay.addEventListener("click", function () { build(false); setPlaying(true); });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
