<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaldea Security — 徽章动画</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpath%20d='M21%204a13%2013%200%201%200%200%2024%2012%2012%200%200%201%200-24z'%20fill='%23e9e2d3'/%3E%3C/svg%3E">
<style>
  :root {
    --night: #0a0e1a;
    --night-2: #101729;
    --ink: #e9e2d3;
    --gold: #d9b98a;
    --star: #c9d3e2;
    --panel: rgba(233, 226, 211, 0.06);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 70% at 50% -10%, var(--night-2) 0%, transparent 60%),
      var(--night);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    height: 100dvh;
    display: grid;
    place-items: center;
  }
  /* ---- 海报卡片 ---- */
  .poster {
    position: relative;
    height: 86vh;
    aspect-ratio: 1512 / 2700;
    max-width: 92vw;
    border-radius: 10px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    background: var(--night);
    outline: 1px solid rgba(233, 226, 211, 0.08);
    outline-offset: -1px;
    z-index: 2;
  }
  .poster svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  .poster svg path {
    fill: var(--ink);
  }
  #emblem-core, #letter-0, #letter-1, #letter-2, #letter-3, #letter-4,
  #letter-5, #letter-6, #letter-7, #letter-8, #letter-9 {
    transform-box: fill-box;
    transform-origin: center;
  }
  #letter-0, #letter-1, #letter-2, #letter-3, #letter-4,
  #letter-5, #letter-6, #letter-7, #letter-8, #letter-9 {
    opacity: 0;
  }
  /* ---- 光晕（徽章背后） ---- */
  .halo {
    position: absolute;
    left: 50%;
    top: 48%;
    width: 72%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(217, 185, 138, 0.16) 0%, rgba(217, 185, 138, 0.05) 42%, transparent 68%);
    border-radius: 50%;
    pointer-events: none;
  }
  /* ---- 星环 ---- */
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .star {
    position: absolute;
    border-radius: 50%;
    background: var(--star);
    opacity: 0;
  }
  /* ---- 控制条 ---- */
  .controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 5;
  }
  .controls button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid rgba(233, 226, 211, 0.22);
    background: var(--panel);
    color: var(--ink);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, transform 0.18s;
  }
  .controls button:hover {
    background: rgba(233, 226, 211, 0.12);
    border-color: rgba(217, 185, 138, 0.55);
  }
  .controls button:active { transform: translateY(1px); }
  .controls button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .controls button svg { width: 13px; height: 13px; fill: currentColor; }
  .reduced .controls { display: none; }
</style>
</head>

  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="controls" role="group" aria-label="动画控制">
    <button id="btnPlay" type="button" aria-label="播放动画">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span id="playLabel">播放</span>
    </button>
    <button id="btnReplay" type="button" aria-label="重播动画">
      <svg viewBox="0 0 24 24"><path d="M12 5V2L6 7l6 5V9a4 4 0 1 1-4 4H6a6 6 0 1 0 6-8z"/></svg>
      <span>重播</span>
    </button>
  </div>
</div>
<script>
(function () {
  "use strict";
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  var running = [];
  var playing = true;

  function spawnStars() {
    var wrap = document.getElementById("stars");
    var N = 26;
    for (var i = 0; i < N; i++) {
      var s = document.createElement("span");
      s.className = "star";
      var ang = (i / N) * Math.PI * 2;
      var r = 0.30 + ((i * 37) % 4) * 0.012;
      s.style.left = (50 + Math.cos(ang) * r * 100).toFixed(2) + "%";
      s.style.top = (48 + Math.sin(ang) * r * 100).toFixed(2) + "%";
      var sz = 1 + ((i * 7) % 3);
      s.style.width = sz + "px";
      s.style.height = sz + "px";
      s.dataset.d = ((i * 0.53) % 3.2).toFixed(2);
      s.dataset.dur = (2.4 + ((i * 13) % 26) / 10).toFixed(2);
      wrap.appendChild(s);
    }
  }

  function build(loop) {
    running.forEach(function (a) { try { a.cancel(); } catch (e) {} });
    running = [];
    var ease = "cubic-bezier(0.22, 1, 0.36, 1)";
    var halo = document.getElementById("halo");
    var emblem = document.getElementById("emblem-core");
    var letters = [];
    for (var i = 0; i < 10; i++) letters.push(document.getElementById("letter-" + i));

    if (!loop) {
      // 入场序列
      running.push(halo.animate(
        [{ opacity: 0, transform: "translate(-50%, -50%) scale(0.72)" },
         { opacity: 1, transform: "translate(-50%, -50%) scale(1)" }],
        { duration: 560, easing: ease, fill: "both" }));
      running.push(emblem.animate(
        [{ opacity: 0, transform: "scale(0.94)" },
         { opacity: 1, transform: "scale(1)" }],
        { duration: 540, easing: ease, fill: "both" }));
      letters.forEach(function (l, idx) {
        running.push(l.animate(
          [{ opacity: 0, transform: "translateY(9px)" },
           { opacity: 1, transform: "translateY(0)" }],
          { duration: 430, delay: 330 + idx * 55, easing: ease, fill: "both" }));
      });
    }

    // 循环氛围
    running.push(halo.animate(
      [{ opacity: 0.78, transform: "translate(-50%, -50%) scale(0.96)" },
       { opacity: 1, transform: "translate(-50%, -50%) scale(1.03)" },
       { opacity: 0.78, transform: "translate(-50%, -50%) scale(0.96)" }],
      { duration: 6000, iterations: Infinity, easing: "ease-in-out" }));
    running.push(emblem.animate(
      [{ transform: "scale(1)" }, { transform: "scale(1.006)" }, { transform: "scale(1)" }],
      { duration: 7200, iterations: Infinity, easing: "ease-in-out" }));
    var stars = document.querySelectorAll(".star");
    Array.prototype.forEach.call(stars, function (s) {
      running.push(s.animate(
        [{ opacity: 0.12 }, { opacity: 0.75 }, { opacity: 0.12 }],
        { duration: parseFloat(s.dataset.dur) * 1000, delay: parseFloat(s.dataset.d) * 1000,
          iterations: Infinity, easing: "ease-in-out" }));
    });
  }

  function setPlaying(on) {
    playing = on;
    running.forEach(function (a) {
      try { if (on) a.play(); else a.pause(); } catch (e) {}
    });
    document.getElementById("playLabel").textContent = on ? "暂停" : "播放";
    document.getElementById("btnPlay").setAttribute("aria-label", on ? "暂停动画" : "播放动画");
  }

  function init() {
    spawnStars();
    var btnPlay = document.getElementById("btnPlay");
    var btnReplay = document.getElementById("btnReplay");
    if (reduced.matches) {
      document.body.classList.add("reduced");
      // 静态呈现：全部元素直接可见
      var letters = document.querySelectorAll("[id^='letter-']");
      Array.prototype.forEach.call(letters, function (l) { l.style.opacity = 1; });
      document.getElementById("halo").style.opacity = 1;
      return;
    }
    build(false);
    setPlaying(true);
    btnPlay.addEventListener("click", function () { setPlaying(!playing); });
    btnReplay.addEventListener("click", function () { build(false); setPlaying(true); });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
